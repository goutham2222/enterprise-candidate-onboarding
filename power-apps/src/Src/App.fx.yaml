App As appinfo:
    BackEnabled: =true
    OnStart: |-
        =Set(
            gblTheme,
            {
                CanvasBg: ColorValue("#F8FAFC"),
                SurfaceBg: ColorValue("#FFFFFF"),
                Border: ColorValue("#E2E8F0"),
                Primary: ColorValue("#4F46E5"),
                PrimaryHover: ColorValue("#4338CA"),
                TextPrimary: ColorValue("#0F172A"),
                TextSecondary: ColorValue("#64748B"),
                SuccessBg: ColorValue("#DCFCE7"),
                SuccessText: ColorValue("#166534"),
                DangerBg: ColorValue("#FEE2E2"),
                DangerText: ColorValue("#991B1B"),
                Radius: 12
            }
        );
        
        Set(gblCurrentUser, User());
        Set(gblHRAdminEmail, "peopleops@organization.com");
    StartScreen: |-
        =If(
            Lower(User().Email) = Lower("peopleops@organization.com"),
            scr_HRDashboard,
        
            !IsEmpty(Filter('Onboarding Tracker', ManagerEmail.Email = User().Email && OnboardingStatus.Value = "Pending Approval")),
            scr_ManagerQueue,
        
            scr_Intake
        )
    Theme: =PowerAppsTheme

    Host As hostControl.DefaultHostControlVariant:
        OnCancel: =false
        OnEdit: =false
        OnNew: =false
        OnSave: =false
        OnView: =false

